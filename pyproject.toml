[project]
name = "fastapi-docs-mcp"
version = "2.0.0"
description = "MCP server for real-time FastAPI documentation access"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["fastapi", "mcp", "documentation", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=4.0.3,<5",
    # Imported directly in server.py (ToolAnnotations). fastmcp currently
    # pulls this in transitively, but an import we rely on must be declared
    # ourselves rather than riding on another package's dependency graph.
    "mcp-types~=2.2",
    "httpx~=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "hypothesis~=6.165",
    "ruff~=0.16",
    "mypy~=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_docs_mcp"]
force-include = { "main.py" = "main.py" }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle (PEP 257)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (replaces the standalone bandit dependency/CI step)
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async (blocking calls in async code)
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "TID",    # flake8-tidy-imports
    "DTZ",    # flake8-datetimez (naive datetimes)
]
# E501 (line length) is deliberately left enabled: the formatter can't
# rewrap comments/docstrings, so this is the only thing that catches those.

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["fastapi_docs_mcp", "main"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are passed by name for their side effects, which ARG flags;
# `assert` is the standard pytest idiom, not a hardening concern (S101); test
# docstrings/naming add no reader value over a descriptive function name (D).
"tests/**" = ["ARG001", "ARG002", "S101", "D"]
"bench/**" = ["S101", "D"]
# The shared httpx client is a module-level, event-loop-keyed singleton by
# design (see http.py's module docstring) -- not a case for a class wrapping
# a single instance, so `global` is the right tool here, not a smell.
"src/fastapi_docs_mcp/http.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# Live, network-dependent tests are opt-in: run with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit the live network (deselected by default)",
]
