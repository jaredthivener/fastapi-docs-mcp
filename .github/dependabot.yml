version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: "increase"
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
    groups:
      # init/analyze must run the same version, so bump them together
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
