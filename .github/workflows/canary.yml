name: Canary

# DESIGN.md principle #1 is "never breaks on upstream change" — the
# include-directive syntax has already changed once ({!...!} -> {* *}).
# The unit test suite mocks the network, so it can't catch upstream drift
# (sitemap format, markdown paths, include syntax). This workflow runs the
# live, network-dependent tests (`tests/test_live.py`, deselected by
# default in `test.yml`) on a schedule so drift is caught by a red
# scheduled run instead of a user report.
#
# Kept separate from test.yml so a flaky/offline upstream never blocks a
# PR merge.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run live integration tests
        run: uv run pytest -m integration
